- apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations:
      meta.helm.sh/release-name: backbone
      meta.helm.sh/release-namespace: backbone
    creationTimestamp: "2026-07-25T22:23:25Z"
    generation: 2
    labels:
      app.kubernetes.io/component: retention
      app.kubernetes.io/instance: backbone
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: backbone
      app.kubernetes.io/version: 0.18.0
      helm.sh/chart: backbone-0.1.0
    name: backbone-audit-rotate
    namespace: backbone
    resourceVersion: "2817"
    uid: 989a7a83-1674-4806-8dc9-83fdff8d7afd
  spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 3
    jobTemplate:
      metadata: {}
      spec:
        backoffLimit: 2
        template:
          metadata:
            labels:
              app.kubernetes.io/instance: backbone
              app.kubernetes.io/managed-by: Helm
              app.kubernetes.io/name: audit-rotate
              app.kubernetes.io/part-of: backbone
              app.kubernetes.io/version: 0.18.0
              helm.sh/chart: backbone-0.1.0
          spec:
            automountServiceAccountToken: false
            containers:
            - args:
              - |
                set -eu
                RETENTION=90
                cd /home/hermes/.hermes
                echo "audit rotation: retention ${RETENTION}d, $(date -Iseconds)"
                f="logs/agent.log"
                if [ -f "$f" ]; then
                  sz=$(wc -c < "$f")
                  # Rotate at 64 MB so a single file cannot fill the volume
                  # between runs. Copy-then-truncate, not mv: the gateway holds
                  # an open file descriptor, and mv would leave it writing to
                  # an unlinked inode that nothing can read.
                  if [ "$sz" -gt 67108864 ]; then
                    cp "$f" "${f}.$(date +%Y%m%d)"
                    : > "$f"
                    echo "rotated $f (${sz} bytes)"
                  else
                    echo "skip $f (${sz} bytes, under threshold)"
                  fi
                fi
                f="audit/audit-*.jsonl"
                if [ -f "$f" ]; then
                  sz=$(wc -c < "$f")
                  # Rotate at 64 MB so a single file cannot fill the volume
                  # between runs. Copy-then-truncate, not mv: the gateway holds
                  # an open file descriptor, and mv would leave it writing to
                  # an unlinked inode that nothing can read.
                  if [ "$sz" -gt 67108864 ]; then
                    cp "$f" "${f}.$(date +%Y%m%d)"
                    : > "$f"
                    echo "rotated $f (${sz} bytes)"
                  else
                    echo "skip $f (${sz} bytes, under threshold)"
                  fi
                fi
                # Prune anything older than the retention window.
                find /home/hermes/.hermes/logs -type f -name '*.[0-9]*' \
                  -mtime "+${RETENTION}" -print -delete 2>/dev/null || true
                echo "audit rotation complete"
              command:
              - /bin/sh
              - -c
              image: docker.io/backbone/hermes-gateway:dev
              imagePullPolicy: IfNotPresent
              name: rotate
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
              - mountPath: /home/hermes/.hermes
                name: state
              - mountPath: /tmp
                name: tmp
            dnsPolicy: ClusterFirst
            restartPolicy: OnFailure
            schedulerName: default-scheduler
            securityContext:
              fsGroup: 10001
              fsGroupChangePolicy: OnRootMismatch
              runAsGroup: 10001
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 30
            volumes:
            - name: state
              persistentVolumeClaim:
                claimName: backbone-gateway-state
            - emptyDir: {}
              name: tmp
    schedule: 17 4 * * *
    startingDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 3
    suspend: false
  status: {}
- apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations:
      meta.helm.sh/release-name: backbone
      meta.helm.sh/release-namespace: backbone
    creationTimestamp: "2026-07-25T22:23:25Z"
    generation: 1
    labels:
      app.kubernetes.io/component: backup
      app.kubernetes.io/instance: backbone
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: backbone
      app.kubernetes.io/version: 0.18.0
      helm.sh/chart: backbone-0.1.0
    name: backbone-backup
    namespace: backbone
    resourceVersion: "1328"
    uid: 57bea98b-e4b3-4dfa-b786-939ef35d46fc
  spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 3
    jobTemplate:
      metadata: {}
      spec:
        backoffLimit: 2
        template:
          metadata:
            labels:
              app.kubernetes.io/instance: backbone
              app.kubernetes.io/managed-by: Helm
              app.kubernetes.io/name: backup
              app.kubernetes.io/part-of: backbone
              app.kubernetes.io/version: 0.18.0
              helm.sh/chart: backbone-0.1.0
          spec:
            automountServiceAccountToken: false
            containers:
            - args:
              - |
                import datetime, os, pathlib, sqlite3, sys

                src = pathlib.Path("/home/hermes/.hermes")
                dest = src / "backups" / datetime.date.today().isoformat()
                dest.mkdir(parents=True, exist_ok=True)

                # sqlite3's online backup API takes a consistent snapshot of a
                # database that another process is actively writing. This is
                # the whole reason this job is Python and not a shell `cp`.
                ok = True
                for db in sorted(src.glob("*.db")):
                    try:
                        with sqlite3.connect(f"file:{db}?mode=ro", uri=True) as s, \
                             sqlite3.connect(dest / db.name) as d:
                            s.backup(d)
                        print(f"backed up {db.name} ({db.stat().st_size} bytes)")
                    except Exception as e:
                        ok = False
                        print(f"FAILED {db.name}: {e}", file=sys.stderr)

                # Prune old backup directories.
                cutoff = datetime.date.today() - datetime.timedelta(
                    days=14)
                for d in (src / "backups").iterdir():
                    if not d.is_dir():
                        continue
                    try:
                        if datetime.date.fromisoformat(d.name) < cutoff:
                            for f in d.iterdir():
                                f.unlink()
                            d.rmdir()
                            print(f"pruned {d.name}")
                    except ValueError:
                        pass  # not a dated directory, leave it alone

                # NOTE: this writes to the SAME volume as the data. That is not
                # a backup, it is a copy -- it survives file deletion and
                # nothing else. Shipping off-cluster is tracked as S2 in
                # docs/02-STATE-TRADEOFFS.md and is NOT done here.
                sys.exit(0 if ok else 1)
              command:
              - python
              - -c
              image: docker.io/backbone/hermes-gateway:dev
              imagePullPolicy: IfNotPresent
              name: backup
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
              - mountPath: /home/hermes/.hermes
                name: state
              - mountPath: /tmp
                name: tmp
            dnsPolicy: ClusterFirst
            restartPolicy: OnFailure
            schedulerName: default-scheduler
            securityContext:
              fsGroup: 10001
              fsGroupChangePolicy: OnRootMismatch
              runAsGroup: 10001
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 30
            volumes:
            - name: state
              persistentVolumeClaim:
                claimName: backbone-gateway-state
            - emptyDir: {}
              name: tmp
    schedule: 0 7 * * *
    successfulJobsHistoryLimit: 3
    suspend: false
