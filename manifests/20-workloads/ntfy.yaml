---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ntfy
  namespace: backbone
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: backbone
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: backbone
  labels:
    app.kubernetes.io/name: ntfy
data:
  server.yml: |
    # In-cluster ntfy. Deliberately NOT configured with upstream-base-url.
    #
    # The host's /etc/ntfy/server.yml forwards to ntfy.sh with an
    # upstream-access-token, because iOS push for a self-hosted ntfy requires
    # relaying through ntfy.sh. That token is a credential and belongs in a
    # Secret, not in a ConfigMap -- so it is set via NTFY_UPSTREAM_ACCESS_TOKEN
    # from backbone-secrets in the Deployment below, not written here.
    #
    # Phase 0 also recorded that ntfy.sh free-tier push is already dead from
    # this datacenter IP (shared-IP quota), which is why Telegram is the primary
    # channel and ntfy is secondary.
    listen-http: ":80"
    cache-file: "/var/cache/ntfy/cache.db"
    cache-duration: "12h"
    attachment-cache-dir: "/var/cache/ntfy/attachments"
    attachment-total-size-limit: "1G"
    attachment-expiry-duration: "3h"
    behind-proxy: true
    auth-file: "/var/cache/ntfy/auth.db"
    # deny-all: an unauthenticated ntfy lets anyone who can reach it publish to
    # any topic. The topic name is the only secret otherwise.
    auth-default-access: "deny-all"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntfy
  namespace: backbone
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: backbone
    app.kubernetes.io/component: notification-bridge
spec:
  # StatefulSet rather than Deployment: ntfy owns a SQLite cache and auth
  # database on a PVC. Same single-writer constraint as the gateway, at 1/1000th
  # the size. A Deployment with a PVC would work identically at replicas 1, but
  # StatefulSet makes the ordering and identity guarantees explicit.
  serviceName: ntfy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        app.kubernetes.io/part-of: backbone
    spec:
      serviceAccountName: ntfy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2586
        runAsGroup: 2586
        fsGroup: 2586
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.11.0
          args: ["serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: NTFY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backbone-config
                  key: ntfy_base_url
            - name: NTFY_UPSTREAM_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backbone-secrets
                  key: ntfy_upstream_token
                  # The host has this set. If a deployment does not, ntfy should
                  # still start -- it just loses upstream iOS relay, which is
                  # already non-functional from this IP anyway.
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              # The host unit grants AmbientCapabilities=CAP_NET_BIND_SERVICE so
              # ntfy can bind :80 as an unprivileged user. In a container that
              # capability is unnecessary: the container has its own network
              # namespace, and binding :80 inside it does not require privilege
              # in any modern runtime. Dropping ALL is a strict improvement over
              # the systemd unit, and worth noting as one of the few places
              # where the container is more locked down than the host.
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # Observed 15 MB RSS on the host across 52 days of uptime.
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: ntfy-config
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # cache-duration is 12h and attachments expire in 3h, so this is
            # bounded by the 1G attachment limit plus message churn.
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: backbone
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: backbone
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
