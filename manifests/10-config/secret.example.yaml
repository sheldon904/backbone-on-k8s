# EXAMPLE ONLY -- this file is a template, not a deployable secret.
#
# Do not `kubectl apply` this. Do not fill it in and commit it. Phase 4 replaces
# it with a SealedSecret, which IS safe to commit because it is encrypted to the
# cluster's controller key. See docs/04-SECRETS.md.
#
# It exists so the key names the workloads expect are documented somewhere
# reviewable. Names come from the Phase 0 audit of ~/.hermes/.env, reduced to
# the subset the containerized stack actually reads (the live host has 38).
#
# To create it for a Phase 2 bring-up, from real values, WITHOUT writing them to
# disk or into shell history:
#
#   kubectl -n backbone create secret generic backbone-secrets \
#     --from-literal=openrouter_api_key="$(read -rs -p 'openrouter: ' v; echo "$v")" \
#     --from-literal=webhook_secret="$(openssl rand -hex 32)" \
#     ...
#
# Then in Phase 4:
#
#   kubectl -n backbone get secret backbone-secrets -o yaml \
#     | kubeseal --format yaml > manifests/10-config/backbone-secrets.sealed.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: backbone-secrets
  namespace: backbone
  labels:
    app.kubernetes.io/part-of: backbone
type: Opaque
stringData:
  # --- required -------------------------------------------------------------
  openrouter_api_key: "REPLACE_ME"
  webhook_secret: "REPLACE_ME"          # HMAC on the public webhook paths
  ntfy_topic: "REPLACE_ME"              # acts as a bearer token; ntfy topics are unauthenticated by default

  # --- Telegram: the primary notification channel ---------------------------
  telegram_bot_token: "REPLACE_ME"
  telegram_home_channel: "REPLACE_ME"
  telegram_allowed_users: "REPLACE_ME"

  # --- credentials that live OUTSIDE .env on the host -----------------------
  # Phase 0 §8 found these as separate files. A migration that only copies .env
  # silently loses them, and the symptom is a Google integration that fails at
  # first use rather than at startup.
  #   ~/.hermes/google_token.json
  #   ~/.hermes/google_client_secret.json
  #   ~/.hermes/ga4-service-account.json
  #   ~/.hermes/auth.json
  # Mounted as files rather than env vars -- they are JSON documents, and env
  # vars leak into `ps`, crash dumps and child processes.
  google_token_json: "REPLACE_ME"
  google_client_secret_json: "REPLACE_ME"
  ga4_service_account_json: "REPLACE_ME"
