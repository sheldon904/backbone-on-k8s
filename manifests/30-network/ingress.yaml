# Phase 2 ingress: the webhook paths only.
#
# On the droplet these three paths are exposed by Tailscale Funnel, not by an
# ingress controller (Phase 0 §5). Their only authentication is a shared secret
# in the request -- PHOTON_WEBHOOK_SECRET / WEBHOOK_SECRET. That is adequate for
# a machine-to-machine callback from Vapi or Photon, which cannot do OIDC, and
# it is why these paths stay outside the Keycloak flow in Phase 4.
#
# The dashboard is deliberately absent from this Ingress. It has no auth in
# front of it until Phase 4 adds oauth2-proxy, and routing to it now would put
# an unauthenticated UI on the public internet. Reach it by port-forward until
# then.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backbone-webhooks
  namespace: backbone
  labels:
    app.kubernetes.io/part-of: backbone
  annotations:
    # k3s ships Traefik as its default ingress controller.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Webhook bodies are small; cap them so a large POST cannot be used to
    # pressure the gateway's memory limit.
    traefik.ingress.kubernetes.io/router.middlewares: backbone-webhook-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - backbone.example.internal
      secretName: backbone-tls
  rules:
    - host: backbone.example.internal
      http:
        paths:
          # Vapi call-end callback. Maps the Funnel path observed in Phase 0:
          #   https://backbone.<tailnet>.ts.net/webhooks/vapi-call-end -> :8645
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway
                port:
                  name: webhook
---
# Rate limit on the public webhook surface. These paths are internet-reachable
# and authenticated only by a shared secret, so the cost of a wrong guess should
# not be unbounded. 20 rps average, burst 40.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webhook-ratelimit
  namespace: backbone
  labels:
    app.kubernetes.io/part-of: backbone
spec:
  rateLimit:
    average: 20
    burst: 40
